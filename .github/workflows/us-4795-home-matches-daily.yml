name: US-4795 Home Matches - Daily Check

on:
  schedule:
    # 01:37 UTC = 08:37 giờ VN hằng ngày. Dùng phút lẻ (không phải :00/:30
    # tròn) theo khuyến nghị của GitHub để tránh bị dồn vào hàng đợi chung
    # với hàng loạt workflow khác chạy đúng giờ tròn — nguyên nhân khiến lần
    # chạy 08:30 VN 14/10/2026 không trigger (GitHub tự ghi nhận: "scheduled
    # workflows may be delayed or dropped during periods of high load").
    - cron: '37 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: write # cần quyền push để commit lại file baseline cross-day sau mỗi lần chạy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run US-4795 home matches tests
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json
          # DB football (nguồn thật, bảng isport_sport_event) — dùng bởi
          # 15-db-cross-check.spec.ts. Thiếu các secret này thì file đó tự
          # fail kết nối (ECONNREFUSED) — set đủ 5 secret trong GitHub repo
          # Settings → Secrets and variables → Actions trước khi mong đợi
          # file 15 chạy được trên CI.
          FOOTBALL_DB_HOST: ${{ secrets.FOOTBALL_DB_HOST }}
          FOOTBALL_DB_PORT: ${{ secrets.FOOTBALL_DB_PORT }}
          FOOTBALL_DB_USER: ${{ secrets.FOOTBALL_DB_USER }}
          FOOTBALL_DB_PASSWORD: ${{ secrets.FOOTBALL_DB_PASSWORD }}
          FOOTBALL_DB_NAME: ${{ secrets.FOOTBALL_DB_NAME }}
          ID_ENCODE_BASE: ${{ secrets.ID_ENCODE_BASE }}
        run: |
          npx playwright test tests/standard/2026-Q3-task-4795-home-matches/ \
            --project=chrome \
            --reporter=json,html \
            2> test-stderr.log || true

      - name: Summarize results
        id: summary
        if: always()
        run: |
          node tests/standard/2026-Q3-task-4795-home-matches/lib/telegram-summarize-ci.cjs

      - name: Commit cross-day baseline
        if: always()
        # 3 file ghi baseline trong test.afterAll() bất kể pass/fail:
        #   - 10-cross-day-regression.spec.ts  → .baseline/matches.json (tầng API, toàn bộ lịch thi đấu)
        #   - 11-ui-daily-user-journey.spec.ts → .baseline/ui-matches.json (tầng UI thật)
        #   - 12-cross-day-extended.spec.ts    → .baseline/my-matches.json (trận yêu thích user theo dõi)
        # Commit lại NGAY ở đây để lần chạy daily KẾ TIẾP đọc được baseline của
        # lần này. Không commit thì toàn bộ cơ chế "so sánh xuyên ngày" (tỷ số
        # đổi sau finished, trận biến mất, UI tiến trình bị lùi, data kẹt nhiều
        # ngày) vô nghĩa — mỗi lần chạy lại bắt đầu từ baseline rỗng vì
        # ubuntu-latest runner không giữ state giữa các lần chạy.
        run: |
          BASELINE_DIR="tests/standard/2026-Q3-task-4795-home-matches/.baseline"
          if [[ -d "$BASELINE_DIR" ]] && ! git diff --quiet -- "$BASELINE_DIR"; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$BASELINE_DIR"
            git commit -m "chore(US-4795): update cross-day baseline [skip ci]"
            # Có thể có commit khác đã push lên main giữa lúc job chạy — rebase rồi
            # thử lại 1 lần, không retry vô hạn để tránh job treo nếu xung đột thật.
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Push baseline thất bại — sẽ thử lại ở lần chạy daily kế tiếp, không chặn job."
          else
            echo "Baseline không đổi hoặc chưa được tạo — bỏ qua commit."
          fi

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Telegram (always)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\n\n🔗 <a href="%s">Xem chi tiết run</a>' "$RUN_URL" >> telegram-message.html
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text@telegram-message.html"

      # 2 step riêng biệt thay vì gộp chung "exit 1" — để tab Actions phân biệt
      # được 2 loại đỏ hoàn toàn khác nhau khi lướt qua danh sách run:
      #   - "crash" = LỖI HẠ TẦNG THẬT (Playwright không chạy được, thiếu
      #     secret, cài browser lỗi...) — cần xem gấp, đây mới là CI/CD bất
      #     thường thật sự.
      #   - "failed" (có N test fail nhưng tạo report bình thường) = có BUG
      #     SẢN PHẨM đã biết (xem chi tiết ở US-4795-tong-hop.xlsx), KHÔNG
      #     phải lỗi của workflow — daily vẫn chạy đúng, chỉ là data/sản phẩm
      #     có vấn đề đã ghi nhận.
      - name: ⚠️ CẢNH BÁO — CI/CD crash (lỗi hạ tầng thật, không phải bug sản phẩm)
        if: steps.summary.outputs.status == 'crash'
        run: |
          echo "::error::Workflow CRASH trước khi chạy xong test — đây là lỗi hạ tầng (thiếu secret, cài Playwright lỗi, v.v.), KHÔNG phải bug sản phẩm. Cần xem log ngay."
          exit 1

      - name: ℹ️ Có bug test fail (đã biết, không phải lỗi CI/CD)
        if: steps.summary.outputs.status == 'failed'
        run: |
          echo "::warning::Có ${{ steps.summary.outputs.failed }} test fail — đây là BUG SẢN PHẨM đã ghi nhận trong US-4795-tong-hop.xlsx, không phải lỗi của workflow daily. Job báo đỏ để dễ nhận thấy ngay trên tab Actions, nhưng không cần coi là CI/CD bị hỏng."
          exit 1
