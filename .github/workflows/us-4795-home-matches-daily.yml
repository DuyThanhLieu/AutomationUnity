name: US-4795 Home Matches - Daily Check

on:
  schedule:
    # 02:00 UTC = 09:00 giờ VN hằng ngày
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run US-4795 home matches tests
        id: run_tests
        continue-on-error: true
        run: |
          npx playwright test tests/standard/2026-Q3-task-4795-home-matches/ \
            --project=chrome \
            --reporter=json > test-results.json

      - name: Summarize results
        id: summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            let passed = 0, failed = 0, skipped = 0;
            const failures = [];
            function walk(suite) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  for (const r of test.results || []) {
                    if (r.status === 'passed') passed++;
                    else if (r.status === 'skipped') skipped++;
                    else { failed++; failures.push(spec.title); }
                  }
                }
              }
              for (const s of suite.suites || []) walk(s);
            }
            for (const s of data.suites || []) walk(s);
            const summary = \`Passed: \${passed}, Failed: \${failed}, Skipped: \${skipped}\`;
            fs.writeFileSync('summary.txt', summary + '\n' + failures.map(f => '- ' + f).join('\n'));
            console.log(summary);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, \`failed=\${failed}\n\`);
          "

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Notify Telegram on failure
        if: steps.summary.outputs.failed != '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(cat summary.txt)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="⚠️ US-4795 Home Matches - Daily test FAILED
          ${SUMMARY}

          Chi tiết: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}"

      - name: Fail job if tests failed
        if: steps.summary.outputs.failed != '0'
        run: exit 1
