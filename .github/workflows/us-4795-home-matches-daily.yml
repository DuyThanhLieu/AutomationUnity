name: US-4795 Home Matches - Daily Check

on:
  schedule:
    # 01:37 UTC = 08:37 giờ VN hằng ngày. Dùng phút lẻ (không phải :00/:30
    # tròn) theo khuyến nghị của GitHub để tránh bị dồn vào hàng đợi chung
    # với hàng loạt workflow khác chạy đúng giờ tròn — nguyên nhân khiến lần
    # chạy 08:30 VN 14/10/2026 không trigger (GitHub tự ghi nhận: "scheduled
    # workflows may be delayed or dropped during periods of high load").
    - cron: '37 1 * * *'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run US-4795 home matches tests
        id: run_tests
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: test-results.json
        run: |
          npx playwright test tests/standard/2026-Q3-task-4795-home-matches/ \
            --project=chrome \
            --reporter=json,html \
            2> test-stderr.log || true

      - name: Summarize results
        id: summary
        if: always()
        run: |
          node -e "
            const fs = require('fs');
            let data;
            try {
              data = JSON.parse(fs.readFileSync('test-results.json', 'utf8'));
            } catch (e) {
              const stderr = fs.existsSync('test-stderr.log') ? fs.readFileSync('test-stderr.log', 'utf8').slice(0, 1500) : '';
              fs.writeFileSync('telegram-message.html', '⚠️ <b>US-4795 Home Matches</b>\nKhông sinh được report (crash trước khi chạy test).\n\n<pre>' + (e.message + '\n' + stderr).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</pre>');
              require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'failed=1\nstatus=crash\n');
              console.log('CRASH — xem telegram-message.html');
              process.exit(0);
            }

            // File endpoint theo đúng tên spec, giữ thứ tự doc US-4640
            const FILE_LABEL = [
              ['01-scheduled-v2.spec.ts', 'scheduled-v2'],
              ['02-scheduled-v1.spec.ts', 'scheduled-v1'],
              ['03-live-v1.spec.ts', 'live-v1'],
              ['04-live-v2.spec.ts', 'live-v2'],
              ['05-my-matches.spec.ts', 'my-matches'],
              ['06-ui-vs-api.spec.ts', 'ui-vs-api'],
              ['07-data-integrity.spec.ts', 'data-integrity'],
              ['08-live-and-rare-cases.spec.ts', 'live-rare-cases'],
              ['09-ui-navigation.spec.ts', 'ui-navigation'],
            ];
            const byFile = new Map(FILE_LABEL.map(([f]) => [f, { passed: 0, failed: 0, skipped: 0, failTitles: [] }]));

            function fileOf(spec) { return (spec.file || '').split('/').pop(); }
            // Giữ lại tên describe block cha (vd 'scheduled-v2 · VN · 2026-10-14 · all')
            // — đây chính là nơi chứa ngày/locale cụ thể bug xảy ra, bị mất nếu chỉ
            // lấy spec.title (tên test con, không có ngày). Với bộ test đã mở rộng
            // nhiều ngày/locale, không có ngày trong tên fail thì không biết bug
            // xảy ra đúng ngày nào để báo lại.
            function walk(suite, describePath) {
              for (const spec of suite.specs || []) {
                const bucket = byFile.get(fileOf(spec));
                const fullTitle = describePath ? describePath + ' › ' + spec.title : spec.title;
                for (const t of spec.tests || []) {
                  for (const r of t.results || []) {
                    if (!bucket) continue;
                    if (r.status === 'passed') bucket.passed++;
                    else if (r.status === 'skipped') bucket.skipped++;
                    else { bucket.failed++; bucket.failTitles.push(fullTitle); }
                  }
                }
              }
              for (const s of suite.suites || []) {
                // Suite gốc (tên file .spec.ts) không cần lặp lại trong path hiển thị.
                const nextPath = /\.spec\.ts$/.test(s.title) ? describePath : (describePath ? describePath + ' › ' + s.title : s.title);
                walk(s, nextPath);
              }
            }
            for (const s of data.suites || []) walk(s, null);

            const { expected = 0, unexpected = 0, skipped = 0 } = data.stats || {};
            const ranAt = new Date().toLocaleString('vi-VN', { timeZone: 'Asia/Ho_Chi_Minh', hour12: false });
            // Ngày VN thật mà bộ test dùng để gọi API (vnDate(0) trong code test) —
            // in rõ ra Telegram để xác nhận mỗi lần chạy đang check ĐÚNG NGÀY HÔM
            // ĐÓ, không phải data cũ bị lặp lại (mỗi ngày trận đấu hoàn toàn khác
            // nhau nên đây là điều cần verify được ngay từ báo cáo, không cần đào log).
            const vnToday = new Date(Date.now() + 7 * 3600_000).toISOString().slice(0, 10);
            const allOk = unexpected === 0;
            const esc = (s) => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');

            const lines = [];
            lines.push((allOk ? '✅' : '⚠️') + ' <b>US-4795 — Home Matches Daily Check</b>');
            lines.push('🕗 ' + esc(ranAt) + ' (giờ VN) · 📅 Data ngày: ' + vnToday);
            lines.push('');
            lines.push('<b>Tổng:</b> ✅ ' + expected + ' pass · ❌ ' + unexpected + ' fail · ⏭ ' + skipped + ' skip');
            lines.push('');
            lines.push('<b>Theo endpoint:</b>');
            for (const [file, label] of FILE_LABEL) {
              const b = byFile.get(file);
              const icon = b.failed > 0 ? '❌' : '✅';
              lines.push(icon + ' <b>' + label + '</b> — ' + b.passed + ' pass, ' + b.failed + ' fail, ' + b.skipped + ' skip');
            }
            // Không cần prefix [label] nữa — describe path (vd 'scheduled-v2 · VN ·
            // 2026-10-14 · all') đã tự chứa đúng tên route + ngày + locale rồi.
            const allFailTitles = FILE_LABEL.flatMap(([f]) => byFile.get(f).failTitles);
            if (allFailTitles.length) {
              lines.push('');
              lines.push('<b>Chi tiết fail:</b>');
              // Giới hạn 20 dòng đầu — bộ test đã mở rộng nhiều ngày/locale nên 1 bug
              // thật (vd VT9 fallback) có thể fail hàng chục case cùng lúc; in hết sẽ
              // vượt giới hạn 4096 ký tự của Telegram. Link report đầy đủ ở cuối tin
              // (xem bước Upload HTML report) vẫn cho xem toàn bộ danh sách thật.
              const MAX_SHOWN = 20;
              for (const t of allFailTitles.slice(0, MAX_SHOWN)) lines.push('• ' + esc(t));
              if (allFailTitles.length > MAX_SHOWN) {
                lines.push('… và ' + (allFailTitles.length - MAX_SHOWN) + ' case khác (xem report đầy đủ)');
              }
            }
            fs.writeFileSync('telegram-message.html', lines.join('\n'));
            console.log('Passed: ' + expected + ', Failed: ' + unexpected + ', Skipped: ' + skipped);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'failed=' + unexpected + '\nstatus=' + (allOk ? 'passed' : 'failed') + '\n');
          "

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Notify Telegram (always)
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          printf '\n\n🔗 <a href="%s">Xem chi tiết run</a>' "$RUN_URL" >> telegram-message.html
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text@telegram-message.html"

      - name: Fail job if tests failed
        if: steps.summary.outputs.failed != '0'
        run: exit 1
